# Local development environment (spec §10).
# Brings up every backing service the platform needs so that two demo companies with three
# demo brands can run side by side on *.localhost hostnames.
#
# Usage:
#   docker compose up -d
#   cp .env.example .env && php artisan key:generate
#   php artisan migrate --database=landlord      # landlord schema
#   php artisan platform:seed-demo               # 2 companies, 3 brands, all provisioned
#
# Nothing here is production configuration. Production PostgreSQL runs on the VPS or a
# managed service behind PgBouncer and is never publicly exposed (spec §10).

name: platform

services:
  postgres:
    image: postgres:17-alpine
    container_name: platform-postgres
    restart: unless-stopped
    environment:
      # Superuser for local development only. tenant:create uses the provisioner role
      # created by docker/postgres/01-roles.sql, mirroring production privileges.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platform_landlord
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_landlord"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    # Present locally so the app exercises transaction pooling the same way production does.
    # Transaction pooling forbids session state, and finding that out locally is the point.
    image: edoburu/pgbouncer:latest
    container_name: platform-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      POOL_MODE: transaction
      # PDO uses protocol-level prepared statements; PgBouncer >= 1.21 tracks them per
      # transaction when this is above 0.
      MAX_PREPARED_STATEMENTS: 200
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 10
      MAX_DB_CONNECTIONS: 20
      AUTH_TYPE: scram-sha-256
      ADMIN_USERS: postgres
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    ports:
      - "6432:5432"

  redis:
    image: redis:7-alpine
    container_name: platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  typesense:
    image: typesense/typesense:27.1
    container_name: platform-typesense
    restart: unless-stopped
    command: >
      --data-dir /data
      --api-key=local-typesense-key
      --enable-cors=false
    ports:
      - "8108:8108"
    volumes:
      - typesense-data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8108/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    # Catches every outbound mail locally. No transactional email provider is configured
    # in development, so no real customer can ever be emailed from a dev machine.
    image: axllent/mailpit:latest
    container_name: platform-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # web UI
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  minio:
    # S3-compatible stand-in for Cloudflare R2 (ADR-0004). Same driver, same per-tenant
    # prefixes, so storage isolation is exercised locally.
    image: minio/minio:latest
    container_name: platform-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    # Creates the local bucket once MinIO is healthy.
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio minio-secret &&
      mc mb --ignore-existing local/platform-local &&
      mc anonymous set download local/platform-local/tenants &&
      echo 'bucket ready'
      "
    restart: "no"

volumes:
  postgres-data:
  redis-data:
  typesense-data:
  minio-data:
