name: CI

# Quality gates from spec §10 and §12.2. During Phase 0 the application does not exist yet,
# so each job checks for composer.json first and reports "not yet scaffolded" instead of
# failing. From Phase 1 Milestone 1 onward every job runs for real and main is protected on
# these checks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: "8.4"

jobs:
  detect:
    name: Detect application
    runs-on: ubuntu-latest
    outputs:
      scaffolded: ${{ steps.check.outputs.scaffolded }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f composer.json ]; then
            echo "scaffolded=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffolded=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Laravel app not scaffolded yet (Phase 0). Skipping PHP jobs."
          fi

  lint:
    name: Pint (formatting)
    needs: detect
    if: needs.detect.outputs.scaffolded == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test

  static-analysis:
    name: Larastan
    needs: detect
    if: needs.detect.outputs.scaffolded == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpstan analyse --no-progress

  tests:
    name: Pest (unit, feature, architecture)
    needs: detect
    if: needs.detect.outputs.scaffolded == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      typesense:
        image: typesense/typesense:30.2
        env:
          TYPESENSE_API_KEY: ci-typesense-key
          TYPESENSE_DATA_DIR: /tmp
        ports: ["8108:8108"]

    # Throwaway CI-only credentials for the service containers above.
    env:
      TYPESENSE_API_KEY: ci-typesense-key
      DB_PASSWORD: ci-store-app
      DB_MIGRATOR_PASSWORD: ci-store-migrator
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql, intl, bcmath, gd, exif
          coverage: xdebug
      # pg_dump must match the server's major version for backups.
      - name: PostgreSQL 17 client
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo "PG_DUMP_BINARY=/usr/lib/postgresql/17/bin/pg_dump" >> "$GITHUB_ENV"
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Bootstrap the roles, the test database and its restore-drill scratch database
        run: |
          for db in store_test store_test_restore_drill; do
            psql -h 127.0.0.1 -U postgres -f database/setup/bootstrap-database.sql \
              -v db="$db" \
              -v app_password="$DB_PASSWORD" \
              -v migrator_password="$DB_MIGRATOR_PASSWORD" \
              -v backup_password=ci-backup
          done
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      # Architecture tests (module boundaries, no tenancy) are their own required check.
      - name: Architecture tests
        run: vendor/bin/pest --group=architecture
      - name: Full suite with coverage
        run: vendor/bin/pest --coverage

  openapi:
    name: API v1 contract
    needs: detect
    if: needs.detect.outputs.scaffolded == 'true'
    runs-on: ubuntu-latest

    # Scramble looks up model columns. An empty database gives the same, deterministic document
    # as a development machine. Throwaway CI-only credentials.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: store
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: store

    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_pgsql, pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      # The OpenAPI document is generated from code (spec §6.1). API v1 is frozen: the
      # generated document must equal the committed contract (docs/api/openapi-v1.json), so
      # every contract change is a reviewed diff, and non-additive changes are named and fail.
      - name: API v1 contract unchanged (or changed additively and committed)
        run: php artisan api:contract --check
      # platform-web generates its TypeScript client from this exact document.
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/api/openapi-v1.json

  security:
    name: Dependency audit
    needs: detect
    if: needs.detect.outputs.scaffolded == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer audit

  deploy-scripts:
    name: Deploy scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck deploy/*.sh deploy/tests/*.sh
      # Release, migration gate, automatic rollback and pruning, with stub php/composer/curl.
      - run: bash deploy/tests/release.test.sh

  docs:
    name: Documentation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # These run from Phase 0, because the docs exist from Phase 0.
      - name: No secrets in tracked files
        run: |
          # Catches an assigned value on a secret-shaped key. Empty assignments (the
          # .env.example form) are fine; a populated one is not.
          if grep -rInE '(PASSWORD|SECRET|API_KEY|ACCESS_KEY|DSN)[[:space:]]*=[[:space:]]*[^[:space:]"'"'"']+' \
               --include='*.env*' --include='*.yml' --include='*.yaml' --include='*.md' . \
             | grep -vE '(local-|ci-|placeholder|example|minio-secret|postgres$|\$\{)' ; then
            echo "::error::Possible committed secret. Use placeholders only (spec §8)."
            exit 1
          fi
      - name: ADR index is complete
        run: |
          missing=0
          for f in docs/adr/[0-9]*.md; do
            base=$(basename "$f")
            grep -q "$base" docs/adr/README.md || { echo "::error::$base missing from ADR index"; missing=1; }
          done
          exit $missing
